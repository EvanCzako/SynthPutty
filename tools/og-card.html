<!doctype html>
<!--
  Source for public/og.png -- the social share preview (Slack, LinkedIn,
  iMessage). Not published as a page: it lives in tools/, which CRA never
  copies, so only the rendered PNG in public/ ships.

  Regenerate after editing:
      npm run og

  The seeds below are copied verbatim from the Midnight block in
  src/styles/variables.module.css, and the --eq-* colours use the same
  color-mix() formulas EQVisualizer reads at runtime, so the card drifts out of
  brand only if someone edits the palette and forgets to re-run the script.

  The motif is the spectrum panel: a harmonic series under a resonant lowpass,
  which is what the app draws while a chord is held. The curve is a static
  synthetic trace, not a capture -- peaks on a harmonic series spaced
  evenly on a log-frequency axis the way an analyser plots them, decaying as
  1/n^0.8, with a resonant lift at the cutoff and a steep rolloff past it.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="./space-grotesk-latin.css" />
        <style>
            :root {
                /* Midnight seeds -- see variables.module.css */
                --seed-page: #0b0b10;
                --seed-bg: #16161e;
                --seed-surface: #24283b;
                --seed-text: #c0caf5;
                --seed-accent: #bb9af7;
                --seed-playhead: #f7768e;

                --ui-text-muted: color-mix(in srgb, var(--seed-text) 78%, var(--seed-surface));

                /* Spectrum visualiser -- same formulas EQVisualizer pulls from
                   getComputedStyle(). */
                --eq-bg: color-mix(in srgb, var(--seed-bg) 92%, var(--seed-page));
                --eq-axis: color-mix(in srgb, var(--seed-text) 55%, var(--seed-page));
                --eq-trace: color-mix(in srgb, var(--seed-playhead) 58%, var(--seed-text));
                --eq-fill: color-mix(in srgb, var(--eq-trace) 22%, transparent);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            /* The screenshot is taken at exactly this size; the body must not
               introduce scrollbars or the capture picks up a grey gutter. */
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--seed-page);
                font-family: 'Space Grotesk', system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .card {
                position: relative;
                width: 100%;
                height: 100%;
                padding: 74px 84px 66px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .glow {
                position: absolute;
                top: -200px;
                right: -170px;
                width: 760px;
                height: 760px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    color-mix(in srgb, var(--seed-accent) 15%, transparent) 0%,
                    transparent 65%
                );
            }

            .top {
                position: relative;
                display: flex;
                align-items: center;
                gap: 48px;
            }

            /* The badge is matted on pure black rather than transparent, so on
               the #0b0b10 page it would read as a hard-edged black square.
               screen blending maps those black pixels to the page colour
               exactly -- screen against #000 is a no-op -- leaving the pink
               frame and purple field. */
            .logo {
                width: 196px;
                height: 196px;
                flex: none;
                mix-blend-mode: screen;
            }

            .tagline {
                font-size: 40px;
                font-weight: 700;
                line-height: 1.15;
                letter-spacing: -0.01em;
                color: var(--seed-text);
            }

            .domain {
                margin-top: 18px;
                font-size: 26px;
                font-weight: 500;
                color: var(--seed-accent);
            }

            .bottom {
                position: relative;
            }

            .readout {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                margin-bottom: 22px;
            }

            .label {
                font-size: 22px;
                font-weight: 500;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--ui-text-muted);
            }

            .caption {
                font-size: 23px;
                font-weight: 400;
                color: var(--ui-text-muted);
            }

            /* The panel the visualiser draws into: its own recessed ground,
               not the page colour. */
            .eq {
                display: block;
                width: 1032px;
                height: 190px;
                border-radius: 10px;
                background: var(--eq-bg);
                box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--seed-surface) 70%, transparent);
            }

            .grid-line {
                stroke: var(--eq-axis);
                stroke-width: 1;
                opacity: 0.16;
            }

            .axis {
                stroke: var(--eq-axis);
                stroke-width: 1;
                opacity: 0.42;
            }

            .fill {
                fill: var(--eq-fill);
            }

            .trace {
                fill: none;
                stroke: var(--eq-trace);
                stroke-width: 2.6;
                stroke-linejoin: round;
                stroke-linecap: round;
                filter: drop-shadow(0 0 7px color-mix(in srgb, var(--eq-trace) 55%, transparent));
            }
        </style>
    </head>
