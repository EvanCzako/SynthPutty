<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%PUBLIC_URL%/SynthPuttyLogo.png" />
        <!-- Space Grotesk itself is requested from index.css; preconnecting here
         starts the TLS handshake before the CSS has even parsed. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <!-- Matches --seed-page of the default Midnight theme. -->
        <meta name="theme-color" content="#0b0b10" />
        <meta
            name="description"
            content="SynthPutty — a polyphonic web synthesiser with a playable keyboard, filter, vibrato and a live frequency spectrum."
        />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <title>SynthPutty</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
