<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!--
            64px, not the 3333x3333 logo. The logo was being served as the
            favicon: 430 KB downloaded on every page load to be painted at
            16px. SynthPuttyLogo.png stays in public/ as the og card's source.
        -->
        <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon-64.png" />
        <!-- Space Grotesk itself is requested from index.css; preconnecting here
         starts the TLS handshake before the CSS has even parsed. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
            No maximum-scale / user-scalable=no. Blocking pinch-zoom page-wide
            fails WCAG 1.4.4, and it was never the right tool: what it was
            guarding is the keyboard, and .keyboard already carries
            `touch-action: none`, which stops the browser reading a touch on a
            key as a scroll or zoom gesture. That is scoped to the instrument,
            so the controls, labels and spectrum stay zoomable.
        -->
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Matches --seed-page of the default Midnight theme. -->
        <meta name="theme-color" content="#0b0b10" />
        <meta
            name="description"
            content="SynthPutty — a polyphonic web synthesiser with a playable keyboard, filter, vibrato and a live frequency spectrum."
        />
        <meta name="color-scheme" content="dark" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!--
            "SynthPutty" is a coined name nobody searches for, so the title
            carries the words people actually type -- "browser synthesizer",
            "online synth" -- with the brand leading only because it is also
            the wordmark.
        -->
        <title>SynthPutty — polyphonic browser synthesizer</title>

        <link rel="canonical" href="https://synthputty.evanczako.com/" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="SynthPutty" />
        <meta property="og:title" content="SynthPutty — polyphonic browser synthesizer" />
        <meta
            property="og:description"
            content="A polyphonic web synthesiser with a playable keyboard, filter, vibrato and a live frequency spectrum."
        />
        <meta property="og:url" content="https://synthputty.evanczako.com/" />
        <!--
            Absolute, and deliberately not %PUBLIC_URL%-relative: a scraper has
            no base URL to resolve a relative path against. public/ is copied
            verbatim by CRA, so og.png survives the build unhashed.
        -->
        <meta property="og:image" content="https://synthputty.evanczako.com/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="SynthPutty — polyphonic browser synthesizer. A frequency spectrum showing a harmonic series under a resonant lowpass."
        />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
